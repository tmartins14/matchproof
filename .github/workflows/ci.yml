name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache generated test matches
        uses: actions/cache@v4
        with:
          path: .cache/matches
          key: matches-${{ hashFiles('packages/sim/src/**') }}
          restore-keys: matches-

      - name: Install
        run: make setup

      - name: Check contracts, lint, typecheck, test
        run: make check-contracts lint typecheck test

      - name: Build web
        run: npm run build
        working-directory: apps/web
