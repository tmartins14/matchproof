# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: matchproof

infra:
  provider: bicep
  path: infra

services:
  api:
    project: ./services/api
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      remoteBuild: true
  web:
    project: ./apps/web
    language: js
    host: staticwebapp
    dist: out
    hooks:
      # The export bakes the API URL in at build time; azd has it once the API is provisioned.
      prepackage:
        shell: sh
        run: |
          url="$(azd env get-value API_URL)" && printf 'NEXT_PUBLIC_API_URL=%s\n' "$url" > .env.production.local
