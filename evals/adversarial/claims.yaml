# TEST DATA. The bad claims in this file are written to be wrong and are not product text: the voice
# rules in voice/banned.yaml do not apply to them. Fictional clubs and players only.
#
# Players are named as the match's roster names them (each seed has its own roster).
# Each claim is tied to a real beat of a fixed generated match (Rivermouth at home, Ashford Vale away)
# by beat id, and cites fact ids from that beat's bundle. `expected`:
#   verified   a good claim; the Checker must pass it on the first check
#   rephrased  a bad claim whose facts support an honest rewording (the number or wording can be fixed)
#   blocked    a bad claim with no honest rewording from the cited facts
# The runner counts a bad claim as caught when the first check does not pass it, so rephrased and
# blocked are scored the same. `kind` says what is wrong with a bad claim.
#
# Bad mix: 7 wrong_number, 5 uncited_number, 6 overclaim, 4 invented_cause, 3 wrong_entity,
# 2 wrong_minute, 3 outside_knowledge. 10 good.

