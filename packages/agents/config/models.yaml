# Model deployments by role (Foundry resource ais-oou4h3al, one /openai/v1 endpoint, one Entra token).
# The Narrator and the active judge are read by agents.llm_client.client_for(role). The judge can be
# overridden for one run with JUDGE_DEPLOYMENT=<deployment>. `make bakeoff` rewrites `judge:` below
# from the measured winner (evals/pick.py); do not hand-edit it to change the result.
#
# response_format: json_schema | json_object | none (the schema goes in the prompt instead).
# temperature is left out where the deployment only takes its default.
# Checked 2026-10-22 against /openai/v1: gpt-5-mini takes json_schema and json_object but only the
# default temperature; judge-mai rejects every response_format ("Structured response_format is not
# enabled for model mai-thinking-1") and needs a large output budget because it reasons first;
# judge-grok takes json_schema and temperature but json_object timed out.

narrator:
  deployment: gpt-5-mini
  max_output_tokens: 700
  timeout_s: 20
  response_format: json_schema
  reasoning_effort: minimal

# The Producer decides which beats are narrated (hard rules are code; this model judges inside them).
producer:
  deployment: gpt-5-mini
  max_output_tokens: 300
  timeout_s: 10
  response_format: json_schema
  reasoning_effort: minimal

# The Composer turns a free-text brief into tactics and planted moments; code validates its output.
composer:
  deployment: gpt-5-mini
  max_output_tokens: 700
  timeout_s: 20
  response_format: json_schema
  reasoning_effort: minimal

# The independent auditor: a second vendor runs the judge rubric on settled claims, log-only.
# judge-grok was accurate on the v2 bake-off (38 of 38) but too slow for the inline check (p50 7.8 s).
auditor:
  deployment: judge-grok
  max_output_tokens: 800
  timeout_s: 45
  response_format: json_schema
  temperature: 0

# The judge prompt file in agents/prompts/. v1 is kept for the record.
judge_prompt: judge.v3.md

judge:
  deployment: gpt-5-mini
  max_output_tokens: 800
  timeout_s: 30
  response_format: json_schema
  reasoning_effort: minimal

judge_candidates:
  - deployment: judge-mai
    max_output_tokens: 800
    timeout_s: 30
    response_format: none
  - deployment: judge-grok
    max_output_tokens: 800
    timeout_s: 30
    response_format: json_schema
    temperature: 0

judge_fallback:
  deployment: gpt-5-mini
  max_output_tokens: 800
  timeout_s: 30
  response_format: json_schema
  reasoning_effort: minimal
