# Model prices per million tokens, by deployment name (the names in models.yaml).
# Until a deployment has all of input_per_million, output_per_million and currency, cost reports
# say "prices not set"; nothing is guessed.
#
# source:   where the numbers came from
# as_of:    the date (YYYY-MM-DD) they were read
# currency: ISO code
#
# Prices are list (pay-as-you-go) rates for Global deployments in USD. Cached-input rates are
# lower (gpt-5-mini 0.03, grok-4.7 0.50) but are not used here, so costs are slight overestimates.
# Azure bills this subscription in CAD; the USD figures are converted on the invoice.

gpt-5-mini:
  input_per_million: 0.25
  output_per_million: 2.00
  currency: USD
  source: "https://azure.microsoft.com/en-us/pricing/details/azure-openai/ (GPT-5-mini Global, region East US)"
  as_of: "2026-10-23"

judge-grok:
  # grok-4.7 is not yet on the Foundry Models pricing page; these are the Azure Retail Prices API
  # meters "4.7 Inp glbl" and "4.7 Outp glbl" for eastus2 (product "Azure Grok Models").
  # The "L" meters (4 / 12 USD) are the long-context tier and do not apply to our short prompts.
  input_per_million: 2.00
  output_per_million: 6.00
  currency: USD
  source: "https://prices.azure.com/api/retail/prices?$filter=contains(productName,'Grok') (meters 4.7 Inp glbl, 4.7 Outp glbl, eastus2)"
  as_of: "2026-10-23"

gpt-5-nano:
  # Not sourced: the Azure pricing page lists GPT-5-nano Global as "$-" and the Retail Prices API has
  # no GPT-5-nano meter (only 5.4 nano). Left unset until a price can be read.
  input_per_million: null
  output_per_million: null
  currency: null
  source: null
  as_of: null

phi-4-mini:
  # Azure Retail Prices API, product "Azure Phi Models", meters "Phi-4-Mini-Input Tokens" (0.000075 per
  # 1K) and "Phi-4-Mini-Output Tokens" (0.0003 per 1K), eastus2. The meter is named for Phi-4-mini, not
  # the -instruct variant we deploy; assumed to be the same price.
  input_per_million: 0.075
  output_per_million: 0.30
  currency: USD
  source: "https://prices.azure.com/api/retail/prices?$filter=productName eq 'Azure Phi Models' (meters Phi-4-Mini-Input Tokens, Phi-4-Mini-Output Tokens, eastus2)"
  as_of: "2026-10-26"

judge-mai:
  # Not in use (bake-off only). Left unset.
  input_per_million: null
  output_per_million: null
  currency: null
  source: null
  as_of: null
