[project]
name = "matchproof-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "matchproof-contracts",
    "matchproof-intel",
    "pydantic>=2",
    "pyyaml",
    "openai>=3.35.1",
    "opentelemetry-api>=1.45.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.uv.sources]
matchproof-contracts = { workspace = true }
matchproof-intel = { workspace = true }
