# Calibration bands for the generator, with league-level reference means and their sources.
# Only published league-level aggregates are used; no source data is stored in the repo.
# per: team (one value per team per match) or match (one value per match).
# unit: count, ratio (0 to 1), m, m2 or xg.
# status: sourced (taken from the source), derived (computed from sourced figures) or provisional (no external figure).
# reference_mean: where set, the mean across runs must be within 12% of it.

- id: passes
  per: team
  band: [360, 600]
  unit: count
  reference_mean: 437
  status: sourced
  source: "playerstats.football, Premier League 2025/26 team passes per match (league mean of 20 teams; team range about 364-588). https://playerstats.football/premier-league/stats/passes/previous"
- id: pass_completion
  per: team
  band: [0.78, 0.89]
  unit: ratio
  reference_mean: 0.825
  status: derived
  source: "Accurate passes 360.5 / passes 437 per team per match, same site and season (team range about 79-88%). https://playerstats.football/premier-league/stats/accurate-passes/previous"
- id: mean_pass_length
  per: team
  band: [17, 22]
  unit: m
  reference_mean: 19.5
  status: sourced
  source: "CIES Football Observatory, 'Length of passes: the best like it short' (InStat data, 35 European leagues; team averages 15.9-23.4 m, league averages about 18.9-21.1 m). https://football-observatory.com/Length-of-passes-the-best-like-it-short"
- id: progressive_pass_share
  per: team
  band: [0.07, 0.16]
  unit: ratio
  reference_mean: null
  status: provisional
  source: "No published league figure found; our definition (10 m closer or into the box) differs from providers'."
- id: shots
  per: team
  band: [8, 18]
  unit: count
  reference_mean: 12.5
  status: sourced
  source: "playerstats.football, Premier League 2025/26 total shots per team per match (team range about 9.4-15.7). https://playerstats.football/premier-league/stats/total-shots/previous"
- id: xg_per_team
  per: team
  band: [0.4, 2.8]
  unit: xg
  reference_mean: 1.47
  status: sourced
  source: "playerstats.football, Premier League 2025/26 team xG per match (team range about 0.89-1.92). https://playerstats.football/premier-league/stats/xg/previous"
- id: xg_per_match
  per: match
  band: [1.5, 3.8]
  unit: xg
  reference_mean: 2.95
  status: derived
  source: "Twice the team mean above."
- id: xg_per_shot
  per: team
  band: [0.08, 0.17]
  unit: xg
  reference_mean: 0.117
  status: derived
  source: "1.47 xG / 12.5 shots per team per match, same season."
  note: upper bound widened from 0.15 to 0.17 (Oct 19) because planted penalties and goals on about 10 shots put end_to_end runs at 0.15 to 0.19 whatever the organic tuning
- id: possession_share
  per: team
  band: [0.35, 0.65]
  unit: ratio
  reference_mean: 0.50
  status: provisional
  source: "By construction for equal default tactics; no external source needed."
  note: share of completed passes
- id: fouls
  per: team
  band: [7, 15]
  unit: count
  reference_mean: 10.9
  status: sourced
  source: "playerstats.football, Premier League 2025/26 fouls committed per team per match (team range about 9.7-13.1). https://playerstats.football/premier-league/stats/fouls-committed/previous"
- id: yellow_cards
  per: team
  band: [0, 5]
  unit: count
  reference_mean: 1.88
  status: sourced
  source: "playerstats.football, Premier League 2025/26 yellow cards per team per match (team range about 1.3-2.6). https://playerstats.football/premier-league/stats/yellow-cards/previous"
- id: corners
  per: team
  band: [2, 10]
  unit: count
  reference_mean: 5.42
  status: sourced
  source: "FCTables, Premier League 2024/25 corners per team per match (team range about 2.3-9.0). https://www.fctables.com/england/premier-league/corners/"

# Positional metrics: per team and match, the median over 5 Hz frames sampled at 1 Hz, computed by sim/geometry.py.
- id: back_line_height_out
  per: team
  band: [26, 40]
  unit: m
  reference_mean: 33.5
  status: derived
  source: "FIFA Training Centre, World Cup 2022: goalkeeper 13.1 m from goal line plus 20.4 m from goalkeeper to defensive line, open play. https://www.fifatrainingcentre.com/en/fwc2022/technical-and-tactical-analysis/goalkeeper-height-and-connection-with-the-defensive-line.php ; definition: https://fifatrainingcentre.com/en/fwc2022/efi-metrics/efi-metric--defensive-line-height-and-team-length.php"
  note: out of possession, all frames
- id: back_line_height_in
  per: team
  band: [32, 52]
  unit: m
  reference_mean: null
  status: provisional
  source: "No published figure; the shape rules (back line at least 5 m higher in possession than out) carry the realism."
- id: team_length_out
  per: team
  band: [22, 34]
  unit: m
  reference_mean: 27.2
  status: sourced
  source: "FIFA Training Centre, World Cup 2022 mid-block analysis: team lengths 22.5-29.1 m, tournament average about 27.2 m. https://www.fifatrainingcentre.com/en/fwc2022/technical-and-tactical-analysis/controlling-the-game-without-the-ball--the-mid-block-and-compactness.php"
  note: out of possession, ball 35 to 85 m from the defending team's goal (the source is a mid-block)
- id: team_width_out
  per: team
  band: [34, 46]
  unit: m
  reference_mean: 40.1
  status: sourced
  source: "Same FIFA article: widths 38.4-40.75 m, average about 40.1 m."
  note: out of possession, ball 35 to 85 m from the defending team's goal (the source is a mid-block)
- id: compactness_out
  per: team
  band: [450, 1000]
  unit: m2
  reference_mean: null
  status: sourced
  source: "Opta Analyst, Opta Vision tracking stats: 'high compactness' under 600 m2, 'low' over 900 m2. https://theanalyst.com/articles/opta-vision-stats-tracking-data-premier-league"
  note: median outfield convex-hull area, out of possession, all frames; band only, no reference mean
