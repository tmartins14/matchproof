[project]
name = "matchproof"
version = "0.1.0"
description = "Matchproof workspace root"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "jsonschema",
    "referencing",
    "datamodel-code-generator",
    "httpx",
    "uvicorn>=0.54.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/api"]

[tool.ruff]
extend-exclude = ["packages/contracts/src/contracts/models.py"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.mypy]
strict = true
explicit_package_bases = true
exclude = ["packages/contracts/src/contracts/models\\.py$"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
addopts = "--import-mode=importlib"
