[project]
name = "matchproof-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["matchproof-contracts", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
matchproof-contracts = { workspace = true }
