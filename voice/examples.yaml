# Narrator few-shot examples. Each line is adapted from the structure of a real source
# (sentence shape, length, what it leads with), rewritten with fictional clubs and players.
# No source text is copied. source_ref points to the source list kept outside the repo
# (Football Analytics project doc "matchproof-voice-sources.md").
#
# Fields: id, beat_kind (beat schema enum), mode (fan | analyst | producer), lang,
# facts (id + display text), line (<= 30 words; every digit must appear in a fact display),
# amended_from / reason (AMENDED examples only), source (original | adapted), source_ref.

# ex-00 is format only and is deliberately flawed: "41 metres" and "both full-backs high" have
# no fact behind them, and "Eleven" is a number word. The numbers-from-facts test must catch
# "41" (strict xfail), which proves the test works. Number words are out of scope for v1.
- id: ex-00
  format_only: true
  beat_kind: counter_goal
  mode: fan
  lang: en
  facts:
    - { id: fx-0001, display: "41′" }
    - { id: fx-0002, display: "11 seconds" }
    - { id: fx-0003, display: "4 passes" }
  line: "Ashford go 41 metres the other way and score. Eleven seconds, four passes, Rivermouth caught with both full-backs high."
  amended_from: null   # for AMENDED examples: the bad draft
  reason: null         # for AMENDED examples: why it was changed
  source: original     # original | adapted

